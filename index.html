<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Habit tracker</title>
  </head>
  <body class="min-h-screen bg-bg-light text-text-light antialiased">
    <div
      class="mx-auto min-h-screen w-full max-w-6xl px-4 py-6 sm:px-6 sm:py-10 lg:px-8"
    >
      <header
        id="person"
        class="flex flex-col gap-5 rounded-3xl border border-amber-950/5 bg-surface-light p-5 shadow-sm sm:flex-row sm:items-center sm:gap-6 sm:p-8"
      >
        <img
          src="./public/batman.jpg"
          alt="Profile avatar"
          class="h-24 w-24 shrink-0 rounded-2xl object-cover sm:h-28 sm:w-28"
        />
        <div class="min-w-0">
          <p
            class="mb-2 text-sm font-semibold uppercase tracking-[0.18em] text-primary-light"
          >
            personal dashboard
          </p>
          <h1
            class="break-words text-2xl font-bold tracking-tight sm:text-3xl lg:text-4xl"
          >
            Mohammad Hadi Alsous
          </h1>
          <p class="mt-2 text-sm leading-6 text-muted-light sm:text-base">
            Frontend developer in the learning stage
          </p>
          <blockquote
            class="mt-4 border-l-2 border-amber-500 pl-3 text-sm italic text-muted-light"
          >
            “The more sad, the more fun later.”
          </blockquote>
        </div>
      </header>

      <main class="mt-8 sm:mt-10">
        <section aria-labelledby="progress-heading">
          <div
            class="mb-5 flex flex-col gap-1 sm:mb-6 sm:flex-row sm:items-end sm:justify-between"
          >
            <div>
              <p class="text-sm font-medium text-primary-light">
                Keep showing up
              </p>
              <h2
                id="progress-heading"
                class="mt-1 text-2xl font-bold tracking-tight sm:text-3xl"
              >
                Your progress
              </h2>
            </div>
            <p class="text-sm text-muted-light">Small steps add up.</p>
          </div>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <article
              id="coins"
              class="relative isolate flex min-h-52 flex-col justify-between overflow-hidden rounded-2xl bg-slate-950 p-5 text-white shadow-sm sm:min-h-60 sm:p-6"
            >
              <img
                src="./public/coins.jpg"
                alt=""
                class="absolute inset-0 -z-20 h-full w-full object-cover opacity-65"
              />
              <div
                class="absolute inset-0 -z-10 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-slate-950/30"
              ></div>
              <div class="flex items-start justify-between gap-3">
                <h3 class="text-lg font-semibold">Coins</h3>
                <span
                  class="rounded-full bg-white/15 px-3 py-1 text-xs font-medium backdrop-blur-sm"
                >
                  Reward
                </span>
              </div>
              <p class="flex items-baseline gap-2">
                <span
                  data-coins="1"
                  class="text-4xl font-bold tracking-tight sm:text-5xl"
                  >1</span
                >
                <span class="text-sm text-white/75">earned</span>
              </p>
            </article>

            <article
              id="golds"
              class="relative isolate flex min-h-52 flex-col justify-between overflow-hidden rounded-2xl bg-amber-950 p-5 text-white shadow-sm sm:min-h-60 sm:p-6"
            >
              <img
                src="./public/golds.jpg"
                alt=""
                class="absolute inset-0 -z-20 h-full w-full object-cover opacity-70"
              />
              <div
                class="absolute inset-0 -z-10 bg-gradient-to-t from-amber-950/90 via-amber-950/15 to-amber-950/20"
              ></div>
              <div class="flex items-start justify-between gap-3">
                <h3 class="text-lg font-semibold">Gold</h3>
                <span
                  class="rounded-full bg-white/15 px-3 py-1 text-xs font-medium backdrop-blur-sm"
                >
                  Collection
                </span>
              </div>
              <p class="flex items-baseline gap-2">
                <span
                  data-golds="1"
                  class="text-4xl font-bold tracking-tight sm:text-5xl"
                  >1</span
                >
                <span class="text-sm text-white/75">collected</span>
              </p>
            </article>

            <article
              id="streak"
              class="relative isolate flex min-h-52 flex-col justify-between overflow-hidden rounded-2xl bg-slate-950 p-5 text-white shadow-sm sm:col-span-2 sm:min-h-60 sm:p-6 lg:col-span-1"
            >
              <img
                src="./public/streak.jpg"
                alt=""
                class="absolute inset-0 -z-20 h-full w-full object-cover opacity-65"
              />
              <div
                class="absolute inset-0 -z-10 bg-gradient-to-t from-slate-950/90 via-slate-950/20 to-slate-950/30"
              ></div>
              <div class="flex items-start justify-between gap-3">
                <h3 class="text-lg font-semibold">Streak</h3>
                <span
                  class="rounded-full bg-white/15 px-3 py-1 text-xs font-medium backdrop-blur-sm"
                >
                  Best effort
                </span>
              </div>
              <p class="flex items-baseline gap-2">
                <span
                  data-streak="1"
                  class="text-4xl font-bold tracking-tight sm:text-5xl"
                  >1</span
                >
                <span class="text-sm text-white/75">day in a row</span>
              </p>
            </article>
          </div>
        </section>

        <nav
          id="links"
          aria-label="Main navigation"
          class="mt-8 flex flex-wrap gap-3 rounded-2xl border border-amber-950/5 bg-surface-light p-4 shadow-sm sm:mt-10 sm:gap-4 sm:p-5"
        >
          <a
            href="./index.html"
            aria-current="page"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl bg-primary-light px-4 py-2 text-sm font-semibold text-white transition hover:bg-accent-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-light sm:flex-none"
          >
            Overview
          </a>
          <a
            href="./habits.html"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-4 py-2 text-sm font-semibold text-muted-light transition hover:bg-amber-50 hover:text-text-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-light sm:flex-none"
          >
            Habits
          </a>
          <a
            href="./messions.html"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-4 py-2 text-sm font-semibold text-muted-light transition hover:bg-amber-50 hover:text-text-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-light sm:flex-none"
          >
            Missions
          </a>
          <a
            href="./shop.html"
            class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-4 py-2 text-sm font-semibold text-muted-light transition hover:bg-amber-50 hover:text-text-light focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-light sm:flex-none"
          >
            Shop
          </a>
        </nav>
      </main>
    </div>
  </body>
</html>
