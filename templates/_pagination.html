{% if is_paginated %}
<div class="mt-6 flex items-center justify-center gap-3 text-sm">
  {% if page_obj.has_previous %}
    <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}" class="inline-flex items-center h-9 px-4 rounded-[10px] border border-line text-ink hover:bg-surface-2 transition-colors">السابق</a>
  {% endif %}
  <span class="text-muted">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}" class="inline-flex items-center h-9 px-4 rounded-[10px] border border-line text-ink hover:bg-surface-2 transition-colors">التالي</a>
  {% endif %}
</div>
{% endif %}
