{% extends 'base.html' %}
{% block content %}
<div class="bg-surface border border-line rounded-[14px] p-6 max-w-xl">
  <h1 class="text-2xl font-semibold text-ink mb-2">حذف مهمة</h1>
  <p class="text-muted">هل أنت متأكد من حذف "{{ object.title }}"؟ ستحذف جلساتها أيضاً ولا يمكن التراجع.</p>
  <form method="post" class="flex flex-wrap gap-3 mt-6">
    {% csrf_token %}
    <button type="submit" class="inline-flex items-center justify-center h-11 px-5 rounded-[10px] border border-danger text-danger font-semibold hover:bg-surface-2 transition-colors focus-visible:ring-2 focus-visible:ring-primary">نعم، احذف</button>
    <a href="{% url 'task_list' %}" class="inline-flex items-center justify-center h-11 px-5 rounded-[10px] border border-line text-ink hover:bg-surface-2 transition-colors">إلغاء</a>
  </form>
</div>
{% endblock %}
