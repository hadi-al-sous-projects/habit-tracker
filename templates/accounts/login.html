{% extends 'base.html' %}
{% block content %}
<div class="text-center mb-6">
  <div class="text-lg font-semibold text-primary-dark">DeepFocus</div>
  <h1 class="mt-2 text-2xl font-semibold text-ink">تسجيل الدخول</h1>
  <p class="mt-1 text-sm text-muted">أهلاً بعودتك، لنكمل تركيزك</p>
</div>
<form method="post">
  {% csrf_token %}
  {% include '_form_fields.html' with form=form %}
  <button type="submit" class="w-full inline-flex items-center justify-center h-11 rounded-[10px] bg-primary text-bg font-semibold hover:bg-primary-hover transition-colors focus-visible:ring-2 focus-visible:ring-primary">دخول</button>
</form>
<p class="mt-4 text-sm text-muted text-center">ما عندك حساب؟ <a href="{% url 'register' %}" class="text-primary underline">أنشئ حساباً</a></p>
{% endblock %}
