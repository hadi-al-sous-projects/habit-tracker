{% for error in form.non_field_errors %}
  <p class="mb-3 text-sm text-danger">{{ error }}</p>
{% endfor %}
{% for field in form %}
  <div class="form-field mb-4">
    <label for="{{ field.id_for_label }}" class="block mb-1 text-sm text-muted">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="mt-1 text-xs text-muted">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}
      <p class="mt-1 text-sm text-danger">{{ error }}</p>
    {% endfor %}
  </div>
{% endfor %}
